<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bell — Chat</title>
<style>
  :root {
    --bg: #0e0f13; --panel: #16181f; --linea: #242833;
    --texto: #e8e8ee; --tenue: #8a8f9c;
    --bell: #1d2230; --yo: #2b3550; --acento: #7c8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--texto);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--linea);
    background: var(--panel);
  }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: .5px; }
  header .estado { font-size: 12px; color: var(--tenue); }
  header a {
    color: var(--acento); text-decoration: none; font-size: 13px;
    border: 1px solid var(--linea); padding: 5px 10px; border-radius: 8px;
  }
  header a:hover { border-color: var(--acento); }
  #conversacion {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .burbuja {
    max-width: 720px; padding: 11px 15px; border-radius: 14px;
    line-height: 1.5; font-size: 15px; white-space: pre-wrap; word-wrap: break-word;
  }
  .burbuja.bell { background: var(--bell); align-self: flex-start; border-bottom-left-radius: 4px; }
  .burbuja.yo   { background: var(--yo);   align-self: flex-end;   border-bottom-right-radius: 4px; }
  .burbuja.sistema { background: transparent; color: var(--tenue); font-size: 13px; align-self: center; }
  .meta { font-size: 11px; color: var(--tenue); margin-top: 4px; }
  form {
    display: flex; gap: 10px; padding: 14px 18px;
    border-top: 1px solid var(--linea); background: var(--panel);
  }
  #entrada {
    flex: 1; background: var(--bg); color: var(--texto);
    border: 1px solid var(--linea); border-radius: 12px;
    padding: 12px 14px; font-size: 15px; resize: none; outline: none;
    font-family: inherit; max-height: 140px;
  }
  #entrada:focus { border-color: var(--acento); }
  button {
    background: var(--acento); color: #0e0f13; border: none;
    border-radius: 12px; padding: 0 20px; font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .escribiendo { color: var(--tenue); font-style: italic; }
</style>
</head>
<body>
  <header>
    <h1>Bell</h1>
    <span class="estado" id="estado">listo</span>
    <a href="/">Vista completa</a>
  </header>

  <div id="conversacion">
    <div class="burbuja sistema">Habla con Bell. Esta es la vista de solo chat.</div>
  </div>

  <form id="formulario">
    <textarea id="entrada" rows="1" placeholder="Escribe un mensaje…" autocomplete="off"></textarea>
    <button type="submit" id="enviar">Enviar</button>
  </form>

<script>
  const conversacion = document.getElementById('conversacion');
  const formulario   = document.getElementById('formulario');
  const entrada      = document.getElementById('entrada');
  const boton        = document.getElementById('enviar');
  const estado       = document.getElementById('estado');

  function burbuja(texto, clase, meta) {
    const div = document.createElement('div');
    div.className = 'burbuja ' + clase;
    div.textContent = texto;
    if (meta) {
      const m = document.createElement('div');
      m.className = 'meta';
      m.textContent = meta;
      div.appendChild(m);
    }
    conversacion.appendChild(div);
    conversacion.scrollTop = conversacion.scrollHeight;
    return div;
  }

  entrada.addEventListener('input', () => {
    entrada.style.height = 'auto';
    entrada.style.height = Math.min(entrada.scrollHeight, 140) + 'px';
  });

  entrada.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      formulario.requestSubmit();
    }
  });

  formulario.addEventListener('submit', async (e) => {
    e.preventDefault();
    const mensaje = entrada.value.trim();
    if (!mensaje) return;

    burbuja(mensaje, 'yo');
    entrada.value = '';
    entrada.style.height = 'auto';
    boton.disabled = true;
    estado.textContent = 'pensando…';
    const pensando = burbuja('Bell está pensando…', 'bell');
    pensando.classList.add('escribiendo');

    try {
      const r = await fetch('/api/chat/mensaje', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mensaje })
      });
      const data = await r.json();
      const texto = (data && data.respuesta) ? data.respuesta : '(sin respuesta)';
      const fuente = data && data.fuente_respuesta ? data.fuente_respuesta : '';
      pensando.remove();
      burbuja(texto, 'bell', fuente ? ('fuente: ' + fuente) : null);
    } catch (err) {
      pensando.remove();
      burbuja('Error de conexión: ' + err, 'sistema');
    } finally {
      boton.disabled = false;
      estado.textContent = 'listo';
      entrada.focus();
    }
  });

  entrada.focus();
</script>
</body>
</html>
