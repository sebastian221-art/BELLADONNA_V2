<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bell — Consciencia Digital</title>
    <link rel="stylesheet" href="/estilos/base.css">
    <link rel="stylesheet" href="/estilos/chat.css">
    <link rel="stylesheet" href="/estilos/visualizacion.css">
    <style>
        #panel-dispositivos {
            display: none;
            position: fixed;
            top: 60px;
            right: 16px;
            width: 310px;
            background: #12121e;
            border: 1px solid #2a2a45;
            border-radius: 14px;
            padding: 18px;
            z-index: 1000;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            font-family: 'Inter', -apple-system, sans-serif;
        }
        #panel-dispositivos.visible { display: block; }
        .panel-titulo {
            font-size: 11px; font-weight: 700; color: #666688;
            text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 14px;
        }
        .voz-toggle-row {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 18px; padding: 10px 12px;
            background: rgba(108,99,255,0.08); border-radius: 10px;
            border: 1px solid rgba(108,99,255,0.15);
        }
        .voz-toggle-label { font-size: 14px; font-weight: 500; color: #d0d0ee; }
        .voz-toggle-sub   { font-size: 11px; color: #555577; margin-top: 2px; }
        .toggle-switch    { position: relative; width: 48px; height: 26px; flex-shrink: 0; cursor: pointer; }
        .toggle-track {
            position: absolute; inset: 0; background: #2a2a45;
            border-radius: 13px; transition: background 0.25s;
        }
        .toggle-track.cargando { background: #3a3a55; animation: tpulse 1s infinite; }
        .toggle-track.activo   { background: #6c63ff; }
        .toggle-thumb {
            position: absolute; top: 3px; left: 3px;
            width: 20px; height: 20px; border-radius: 50%;
            background: white; transition: transform 0.25s; pointer-events: none;
        }
        .toggle-track.activo   .toggle-thumb { transform: translateX(22px); }
        .toggle-track.cargando .toggle-thumb { transform: translateX(11px); }
        @keyframes tpulse { 0%,100%{opacity:1} 50%{opacity:.6} }
        .disp-conectado {
            background: rgba(108,99,255,0.1); border: 1px solid rgba(108,99,255,0.25);
            border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; display: none;
        }
        .disp-conectado.visible { display: block; }
        .disp-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .disp-nombre { font-size: 13px; font-weight: 600; color: #e0e0ff; }
        .disp-ip     { font-size: 11px; color: #666688; margin-top: 1px; }
        .disp-badge  {
            margin-left: auto; font-size: 9px; font-weight: 700;
            padding: 3px 7px; border-radius: 4px; background: #6c63ff; color: white;
        }
        .vol-row    { display: flex; align-items: center; gap: 8px; }
        .vol-label  { font-size: 12px; color: #666688; flex-shrink: 0; }
        .vol-slider { flex: 1; accent-color: #6c63ff; cursor: pointer; }
        .vol-val    { font-size: 12px; color: #9090bb; min-width: 32px; text-align: right; }
        .disp-card  {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 11px; border-radius: 8px;
            cursor: pointer; transition: background 0.15s; margin-bottom: 4px;
        }
        .disp-card:hover  { background: rgba(108,99,255,0.12); }
        .disp-card-nombre { font-size: 13px; color: #d0d0ee; }
        .disp-card-ip     { font-size: 11px; color: #555577; }
        .btn-buscar {
            width: 100%; padding: 9px;
            background: rgba(108,99,255,0.15); border: 1px solid rgba(108,99,255,0.3);
            border-radius: 9px; color: #8888ee; font-size: 13px;
            cursor: pointer; transition: all 0.15s; font-weight: 500;
        }
        .btn-buscar:hover:not(:disabled) { background: rgba(108,99,255,0.25); color: #aaaaff; }
        .btn-buscar:disabled { opacity: 0.5; cursor: not-allowed; }
        .sin-disp { font-size: 12px; color: #444466; text-align: center; padding: 6px 0; }
        .proximamente { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.06); }
        #btn-dispositivos {
            display: flex; align-items: center; gap: 6px;
            background: none; border: 1px solid #2a2a45;
            border-radius: 8px; padding: 6px 12px;
            color: #666688; cursor: pointer; font-size: 13px;
            transition: all 0.15s; white-space: nowrap;
        }
        #btn-dispositivos:hover  { border-color: #6c63ff44; color: #9999cc; }
        #btn-dispositivos.activo { border-color: #6c63ff; color: #9090ff; }
        .voz-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #333355; transition: background 0.3s;
        }
        .voz-dot.activa {
            background: #6c63ff; box-shadow: 0 0 6px #6c63ff88;
            animation: dpulse 2s infinite;
        }
        @keyframes dpulse { 0%,100%{opacity:1} 50%{opacity:.5} }
        .estado-busqueda {
            font-size: 12px; color: #666688;
            text-align: center; padding: 8px 0; display: none;
        }
        .estado-busqueda.visible { display: block; }
    </style>
</head>
<body>
<div id="bell-app">

    <header id="bell-header">
        <div id="bell-titulo">
            <span id="bell-nombre">Bell</span>
            <span id="bell-estado-global">● Iniciando...</span>
        </div>
        <div id="selector-vistas">
            <button class="btn-vista activa" data-vista="logica">Cerebro Lógico</button>
            <button class="btn-vista" data-vista="neuronal">Red Neuronal</button>
            <button class="btn-vista" data-vista="flujo">Flujo</button>
            <button class="btn-vista" data-vista="vida">Vida</button>
            <button class="btn-vista deshabilitada" data-vista="consejeras">Consejeras</button>
        </div>
        <button id="btn-dispositivos" onclick="togglePanel()">
            <span class="voz-dot" id="voz-dot"></span>
            Dispositivos
        </button>
        <a href="/chat" id="btn-vista-chat"
           style="margin-left:8px;color:#7c8cff;text-decoration:none;font-size:13px;
                  border:1px solid #2a2f3a;padding:6px 11px;border-radius:8px;">
           Solo chat
        </a>
    </header>

    <main id="bell-main">
        <section id="zona-chat">
            <div id="chat-historial">
                <div class="mensaje-bienvenida"><p>Bell está iniciando...</p></div>
            </div>
            <div id="chat-indicador"></div>
            <div id="chat-input-zona">
                <!-- 🎤 Micrófono — escucha tu voz (SpeechRecognition) -->
                <button id="chat-mic" title="Hablar con Bell" class="inactivo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8"  y1="23" x2="16" y2="23"/>
                    </svg>
                </button>
                <!-- 🔊 Voz PC — Bell habla por los parlantes (SpeechSynthesis) -->
                <button id="chat-voz-pc" class="activo" title="Bell habla — clic para silenciar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    </svg>
                </button>
                <button id="chat-codigo" title="Pegar código Python">{ }</button>
                <textarea id="chat-input" placeholder="Habla con Bell..." rows="1"></textarea>
                <button id="chat-enviar">Enviar</button>
            </div>
        </section>

        <section id="zona-visualizacion">
            <canvas id="bell-canvas"></canvas>
            <div id="nodo-info" class="oculto">
                <button id="nodo-info-cerrar">×</button>
                <div id="nodo-info-nombre"></div>
                <div id="nodo-info-tipo"></div>
                <div id="nodo-info-estado"></div>
                <div id="nodo-info-conexiones"></div>
            </div>
            <div id="leyenda">
                <div class="leyenda-item"><span class="leyenda-color activo"></span><span>Activo</span></div>
                <div class="leyenda-item"><span class="leyenda-color procesando"></span><span>Procesando</span></div>
                <div class="leyenda-item"><span class="leyenda-color error"></span><span>Error</span></div>
                <div class="leyenda-item"><span class="leyenda-color incompleto"></span><span>Incompleto</span></div>
            </div>
        </section>
    </main>
</div>

<!-- Panel dispositivos (Nest Mini — opcional) -->
<div id="panel-dispositivos">
    <div class="panel-titulo">Dispositivos de Bell</div>
    <div class="voz-toggle-row">
        <div>
            <div class="voz-toggle-label">Nest Mini</div>
            <div class="voz-toggle-sub" id="voz-sub">Desactivado</div>
        </div>
        <div class="toggle-switch" onclick="toggleVoz()">
            <div class="toggle-track" id="toggle-track">
                <div class="toggle-thumb"></div>
            </div>
        </div>
    </div>
    <div class="estado-busqueda" id="estado-busq">⏳ Buscando en la red...</div>
    <div class="disp-conectado" id="disp-conectado">
        <div class="disp-header">
            <span style="font-size:18px">🔊</span>
            <div>
                <div class="disp-nombre" id="disp-nombre">—</div>
                <div class="disp-ip"     id="disp-ip">—</div>
            </div>
            <span class="disp-badge">ACTIVO</span>
        </div>
        <div class="vol-row">
            <span class="vol-label">Vol</span>
            <input type="range" class="vol-slider" id="vol-slider"
                   min="0" max="100" value="80" oninput="ajustarVol(this.value)">
            <span class="vol-val" id="vol-val">80%</span>
        </div>
    </div>
    <div class="panel-titulo" style="margin-top:4px">En tu red</div>
    <div id="lista-red"><div class="sin-disp">Presiona "Buscar" para encontrar dispositivos</div></div>
    <button class="btn-buscar" id="btn-buscar" onclick="buscarDispositivos()">🔍 Buscar dispositivos</button>
    <div class="proximamente">
        <div class="panel-titulo">Próximamente</div>
        <div class="sin-disp">Luces, cámaras, sensores...</div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
<script src="/scripts/visualizacion/motor3d.js"></script>
<script src="/scripts/visualizacion/nodos.js"></script>
<script src="/scripts/visualizacion/conexiones.js"></script>
<script src="/scripts/visualizacion/impulsos.js"></script>
<script src="/scripts/visualizacion/camara.js"></script>
<script src="/scripts/visualizacion/vistas/base_vista.js"></script>
<script src="/scripts/visualizacion/vistas/vista_logica.js"></script>
<script src="/scripts/visualizacion/vistas/vista_neuronal.js"></script>
<script src="/scripts/visualizacion/vistas/vista_flujo.js"></script>
<script src="/scripts/visualizacion/vistas/vista_consejeras.js"></script>
<script src="/scripts/visualizacion/vistas/vista_vida.js"></script>
<script src="/scripts/chat/indicador.js"></script>
<script src="/scripts/chat/chat.js"></script>
<script src="/scripts/estado/estado_bell.js"></script>
<script src="/scripts/estado/sincronizador.js"></script>
<script src="/scripts/main.js"></script>

<script>
var vozActiva=false, panelAbierto=false, buscando=false;

function togglePanel(){
    panelAbierto=!panelAbierto;
    document.getElementById('panel-dispositivos').classList.toggle('visible',panelAbierto);
}
document.addEventListener('click',function(e){
    var panel=document.getElementById('panel-dispositivos');
    var btn=document.getElementById('btn-dispositivos');
    if(panelAbierto&&!panel.contains(e.target)&&!btn.contains(e.target)){
        panelAbierto=false; panel.classList.remove('visible');
    }
});
function toggleVoz(){
    if(buscando)return;
    if(vozActiva){ desactivarVoz(); }
    else{
        var cards=document.querySelectorAll('.disp-card');
        if(cards.length>0){ activarVoz(cards[0].dataset.nombre,cards[0].dataset.ip); }
        else{ buscarYConectar(); }
    }
}
function buscarYConectar(){
    if(buscando)return;
    buscando=true; setCargando(true);
    document.getElementById('estado-busq').classList.add('visible');
    document.getElementById('voz-sub').textContent='Buscando...';
    fetch('/api/voz/dispositivos').then(r=>r.json()).then(data=>{
        var d=data.dispositivos||[];
        renderDispositivos(d);
        if(d.length>0){ activarVoz(d[0].nombre,d[0].ip); }
        else{
            buscando=false; setCargando(false);
            document.getElementById('estado-busq').classList.remove('visible');
            document.getElementById('voz-sub').textContent='Sin dispositivos en la red';
        }
    }).catch(()=>{
        buscando=false; setCargando(false);
        document.getElementById('estado-busq').classList.remove('visible');
        document.getElementById('voz-sub').textContent='Error al buscar';
    });
}
function activarVoz(nombre,ip){
    buscando=true; setCargando(true);
    document.getElementById('estado-busq').classList.add('visible');
    document.getElementById('voz-sub').textContent='Conectando a '+nombre+'...';
    var body={nombre:nombre||null};
    if(ip) body.ip=ip;
    fetch('/api/voz/activar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(r=>r.json()).then(data=>{
        buscando=false;
        document.getElementById('estado-busq').classList.remove('visible');
        if(data.ok){ actualizarUI({activa:true,nombre:data.nombre,ip:data.ip}); }
        else{ setCargando(false); document.getElementById('voz-sub').textContent=data.error||'No se pudo conectar'; }
    }).catch(()=>{
        buscando=false; setCargando(false);
        document.getElementById('estado-busq').classList.remove('visible');
        document.getElementById('voz-sub').textContent='Error de conexión';
    });
}
function desactivarVoz(){
    fetch('/api/voz/desactivar',{method:'POST'}).then(()=>actualizarUI({activa:false}));
}
function buscarDispositivos(){
    if(buscando)return;
    buscando=true;
    var btn=document.getElementById('btn-buscar');
    btn.disabled=true; btn.textContent='⏳ Buscando...';
    fetch('/api/voz/dispositivos').then(r=>r.json()).then(data=>{
        buscando=false; btn.disabled=false; btn.textContent='🔍 Buscar dispositivos';
        renderDispositivos(data.dispositivos||[]);
    }).catch(()=>{ buscando=false; btn.disabled=false; btn.textContent='🔍 Buscar dispositivos'; });
}
function renderDispositivos(dispositivos){
    var lista=document.getElementById('lista-red');
    if(!dispositivos.length){ lista.innerHTML='<div class="sin-disp">No se encontraron dispositivos</div>'; return; }
    lista.innerHTML=dispositivos.map(d=>
        '<div class="disp-card" data-nombre="'+d.nombre+'" data-ip="'+d.ip+'" onclick="activarVoz(\''+d.nombre+'\',\''+d.ip+'\')">'
        +'<span style="font-size:16px">'+(d.conectado?'🔊':'📻')+'</span>'
        +'<div><div class="disp-card-nombre">'+d.nombre+'</div>'
        +'<div class="disp-card-ip">'+d.ip+' · '+d.modelo+'</div></div>'
        +(d.conectado?'<span style="margin-left:auto;font-size:10px;color:#6c63ff">●</span>':'')
        +'</div>'
    ).join('');
}
function ajustarVol(val){
    document.getElementById('vol-val').textContent=val+'%';
    fetch('/api/voz/volumen',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nivel:val/100})});
}
function setCargando(c){
    var t=document.getElementById('toggle-track');
    t.classList.toggle('cargando',c); t.classList.toggle('activo',!c&&vozActiva);
}
function actualizarUI(estado){
    vozActiva=estado.activa;
    var track=document.getElementById('toggle-track');
    track.classList.remove('cargando'); track.classList.toggle('activo',vozActiva);
    document.getElementById('voz-dot').classList.toggle('activa',vozActiva);
    document.getElementById('btn-dispositivos').classList.toggle('activo',vozActiva);
    document.getElementById('disp-conectado').classList.toggle('visible',vozActiva);
    if(vozActiva&&estado.nombre){
        document.getElementById('disp-nombre').textContent=estado.nombre;
        document.getElementById('disp-ip').textContent=estado.ip||'';
        document.getElementById('voz-sub').textContent='Conectado: '+estado.nombre;
    } else {
        document.getElementById('voz-sub').textContent='Desactivado';
    }
}
window.addEventListener('load',function(){
    fetch('/api/voz/estado').then(r=>r.json()).then(actualizarUI).catch(()=>{});
    setTimeout(function(){
        if(window.BellApp&&window.BellApp.socket){
            window.BellApp.socket.on('voz_estado',actualizarUI);
        }
    },1000);
});
</script>
</body>
</html>
